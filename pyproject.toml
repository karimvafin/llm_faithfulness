[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm_faithfulness"
version = "0.1.0"
description = "Faithfulness evaluation and DPO training for mediator-conditioned LLMs (PAUQ)."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3",
    "transformers>=4.45",
    "datasets>=2.20",
    "accelerate>=0.33",
    "peft>=0.12",
    "trl>=0.11",
    "sql_metadata>=2.11",
    "openai>=1.40",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "nltk>=3.8",
]

[tool.setuptools.packages.find]
include = ["llm_faithfulness*"]
